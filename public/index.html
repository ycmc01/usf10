main { max-width: 1280px; margin: 0 auto; padding: 16px 20px 40px; }
.stars { color: var(--warn); letter-spacing: -1px; white-space: nowrap; }
.neu { font-weight: 600; } .neu.hi::before { content: '▲ '; font-size: 10px; } .neu.lo::before { content: '▼ '; font-size: 10px; }
.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
@media (max-width: 1100px) { .cards { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .cards { grid-template-columns: 1fr; } main { padding: 12px; } }
.mcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.mcard.worst { border-color: var(--warn); box-shadow: 0 0 0 1px var(--warn) inset; }
.mcard .v { font-size: 24px; font-weight: 700; font-family: var(--mono); }
.mcard .hd { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
.mcard .nm { font-weight: 600; }
.mcard svg { width: 100%; height: 46px; display: block; }
.pctbar { position: relative; height: 6px; background: var(--panel2); border-radius: 3px; margin-top: 2px; }
.pctbar i { position: absolute; top: -3px; width: 3px; height: 12px; background: var(--text); border-radius: 1px; }
.pctbar .bad { position: absolute; top: 0; height: 6px; background: var(--warn-soft); }
.tbl-wrap { overflow-x: auto; }
tr.clickrow { cursor: pointer; } tr.clickrow:hover td { background: var(--panel2); }
tr.past td { color: var(--muted); }
.chart svg { width: 100%; display: block; }
.chart .tip { position: absolute; }
.chart { position: relative; }
.flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.seg2 a { padding: 5px 10px; border: 1px solid var(--line); border-radius: 7px; color: var(--muted); }
.seg2 a.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
footer.disc { text-align: center; color: var(--muted); font-size: 12px; padding: 18px 0 26px; border-top: 1px solid var(--line); margin-top: 30px; }
.note { font-size: 12px; color: var(--muted); }
.vixbox { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
